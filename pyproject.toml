[project]
name = "email-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mattiabestiaccia", email = "bruscia95@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.192.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
    "google-genai>=1.66.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "tenacity>=9.1.4",
]

[project.scripts]
email-triage = "email_triage:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
